<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
<title>CryptositNews</title>
</head>

<body class="bg-slate-950 text-white">

<div class="p-6 border-b border-slate-800 flex justify-between">
  <h1 class="font-bold">🚀 CryptositNews</h1>
  <span class="text-green-400 text-sm">LIVE</span>
</div>

<div class="grid grid-cols-4 gap-6 p-6">

<div class="col-span-3 space-y-4">

{% for item in news %}
<div class="bg-slate-900 p-5 rounded-xl hover:bg-slate-800 transition">
  <div class="text-red-400 text-xs mb-2">🚨 BREAKING</div>
  <div class="font-semibold text-lg">{{ item.title }}</div>
  <a href="/news/{{ item.id }}" class="text-blue-400 text-sm">Read →</a>
</div>
{% endfor %}

</div>

<div class="space-y-4">

<div class="bg-slate-900 p-4 rounded-xl">
  <h3>Market</h3>
  <p>BTC $81k</p>
  <p>ETH $3.2k</p>
</div>

<div class="bg-slate-900 p-4 rounded-xl">
  <h3>Trending</h3>
  <p>#Bitcoin</p>
  <p>#ETF</p>
</div>

</div>

</div>

</body>
</html>

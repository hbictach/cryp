<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<title>CryptositNews</title>

<style>
body {
  background: radial-gradient(circle at top, #0f172a, #020617);
}
.card:hover {
  border-color: #38bdf8;
  transform: translateY(-2px);
  transition: 0.2s;
}
</style>

</head>

<body class="text-white font-sans">

<!-- HEADER -->
<div class="flex justify-between items-center px-6 py-4 border-b border-slate-800">

  <h1 class="text-lg font-bold">🚀 CryptositNews</h1>

  <!-- SEARCH -->
  <form method="get">
    <input name="search" value="{{ search }}"
           placeholder="Search news..."
           class="bg-slate-900 px-4 py-2 rounded-lg text-sm border border-slate-700">
  </form>

</div>

<!-- TABS -->
<div class="flex gap-4 px-6 py-3 text-sm border-b border-slate-800">

  <a href="/?tab=all" class="{% if tab=='all' %}text-blue-400{% endif %}">All</a>

  <a href="/?tab=bitcoin" class="{% if tab=='bitcoin' %}text-blue-400{% endif %}">
    Bitcoin
  </a>

  <a href="/?tab=ethereum" class="{% if tab=='ethereum' %}text-blue-400{% endif %}">
    Ethereum
  </a>

  <a href="/?tab=defi" class="{% if tab=='defi' %}text-blue-400{% endif %}">
    DeFi
  </a>

  <a href="/?tab=nft" class="{% if tab=='nft' %}text-blue-400{% endif %}">
    NFT
  </a>

</div>

<!-- MAIN -->
<div class="grid grid-cols-4 gap-6 p-6">

<!-- NEWS -->
<div class="col-span-3 space-y-4">

{% for item in news %}

<div class="card bg-slate-900 p-5 rounded-xl border border-slate-800">

  <!-- TOP -->
  <div class="flex justify-between items-center text-xs mb-2">

    <span class="bg-blue-600 px-2 py-1 rounded">
      {{ item.category }}
    </span>

    <span class="text-slate-400">
      {{ item.time }}
    </span>

  </div>

  <!-- TITLE -->
  <div class="text-sm font-semibold mb-2">
    {{ item.title }}
  </div>

  <!-- SOURCE -->
  <div class="text-xs text-slate-400 mb-2">
    {{ item.source }}
  </div>

  <!-- META -->
  <div class="flex gap-3 text-xs">

    <span class="
    {% if item.sentiment == 'bullish' %}text-green-400
    {% elif item.sentiment == 'bearish' %}text-red-400
    {% else %}text-gray-400{% endif %}
    ">
      {{ item.sentiment }}
    </span>

    <span class="text-yellow-400">
      {{ item.impact }}
    </span>

  </div>

  <!-- LINK -->
  <div class="mt-3">
    <a href="{{ item.url }}" target="_blank"
       class="text-blue-400 text-xs">
       Read more →
    </a>
  </div>

</div>

{% endfor %}

</div>

<!-- SIDEBAR -->
<div class="space-y-4">

<div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
  <h3 class="mb-2 text-sm">📊 Market</h3>
  <p>BTC</p>
  <p>ETH</p>
  <p>SOL</p>
</div>

<div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
  <h3 class="mb-2 text-sm">🔥 Trending</h3>
  <p>#Bitcoin</p>
  <p>#ETF</p>
</div>

</div>

</div>

</body>
</html>

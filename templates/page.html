<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{{ seo_description }}">
<meta name="keywords" content="{{ seo_keywords | join(', ') }}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{ canonical_url }}">
<title>{{ seo_title }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background: linear-gradient(180deg, rgba(15,23,42,.72), #020617 42%), radial-gradient(circle at 20% 0%, rgba(34,211,238,.18), transparent 32rem), #020617; }
.surface { background: rgba(15,23,42,.8); border: 1px solid rgba(148,163,184,.16); box-shadow: 0 24px 80px rgba(0,0,0,.28); }
</style>
</head>
<body class="min-h-screen text-slate-100 antialiased">
<header class="border-b border-slate-800/80 bg-slate-950/85 backdrop-blur-2xl">
  <div class="mx-auto flex max-w-5xl flex-col gap-4 px-4 py-5 sm:flex-row sm:items-center sm:justify-between">
    <a href="/" class="flex items-center gap-3"><span class="grid h-10 w-10 place-items-center rounded-2xl bg-cyan-300 font-black text-slate-950">◆</span><span class="text-xl font-black">CryptositNews</span></a>
    <nav class="flex gap-5 text-sm font-semibold text-slate-300"><a href="/" class="hover:text-cyan-300">News</a><a href="/about" class="hover:text-cyan-300">About</a><a href="/editorial-policy" class="hover:text-cyan-300">Policy</a><a href="/learn" class="hover:text-cyan-300">Learn</a></nav>
  </div>
</header>
<main class="mx-auto max-w-5xl px-4 py-12">
  <section class="surface rounded-[2rem] p-6 md:p-10">
    <p class="text-xs font-black uppercase tracking-[0.28em] text-cyan-300">CryptositNews</p>
    <h1 class="mt-4 max-w-4xl text-4xl font-black leading-tight md:text-6xl">{{ content.heading }}</h1>
    <p class="mt-5 max-w-3xl text-lg leading-8 text-slate-300">{{ content.description }}</p>
    <ul class="mt-8 grid gap-4 text-slate-200 md:grid-cols-2">
      {% for bullet in content.bullets %}<li class="rounded-2xl border border-slate-800 bg-slate-950/60 p-5">✓ {{ bullet }}</li>{% endfor %}
    </ul>
  </section>
</main>
<footer class="border-t border-slate-800 px-4 py-8 text-center text-sm text-slate-500">CryptositNews — crypto education and news monitoring. Not financial advice.</footer>
</body>
</html>

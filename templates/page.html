<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{{ seo_description }}">
<meta name="keywords" content="{{ seo_keywords | join(', ') }}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{ canonical_url }}">
<title>{{ seo_title }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background: radial-gradient(circle at top, rgba(56,189,248,.18), transparent 30rem), #020617; }
.glass { background: rgba(15,23,42,.78); backdrop-filter: blur(16px); }
</style>
</head>
<body class="min-h-screen text-white">
<header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur-xl">
  <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-5">
    <a href="/" class="text-xl font-black">🚀 CryptositNews</a>
    <nav class="flex gap-4 text-sm text-slate-300">
      <a href="/" class="hover:text-cyan-300">News</a>
      <a href="/about" class="hover:text-cyan-300">About</a>
      <a href="/editorial-policy" class="hover:text-cyan-300">Policy</a>
      <a href="/learn" class="hover:text-cyan-300">Learn</a>
    </nav>
  </div>
</header>
<main class="mx-auto max-w-5xl px-4 py-12">
  <section class="glass rounded-[2rem] border border-slate-800 p-6 md:p-10">
    <p class="text-sm font-bold uppercase tracking-[0.25em] text-cyan-300">CryptositNews</p>
    <h1 class="mt-3 text-4xl font-black md:text-5xl">{{ content.heading }}</h1>
    <p class="mt-5 max-w-3xl text-lg leading-8 text-slate-300">{{ content.description }}</p>
    <ul class="mt-8 space-y-4 text-slate-200">
      {% for bullet in content.bullets %}
      <li class="rounded-2xl border border-slate-800 bg-slate-950/50 p-4">✅ {{ bullet }}</li>
      {% endfor %}
    </ul>
  </section>
</main>
<footer class="border-t border-slate-800 px-4 py-8 text-center text-sm text-slate-500">CryptositNews — crypto education and news monitoring. Not financial advice.</footer>
</body>
</html>
